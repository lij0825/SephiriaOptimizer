name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish (e.g. v2.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare release archive from Dist payload
        id: package
        shell: bash
        run: |
          set -euo pipefail
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          TAG_VER="${RAW_TAG#v}"

          if [[ ! -f "Dist/SephiriaOptimizer.dll" || ! -f "Dist/metadata.json" ]]; then
            echo "::error::Dist/SephiriaOptimizer.dll or Dist/metadata.json is missing. Run 'dotnet build -c Release' before tagging."
            exit 1
          fi

          META_VER="$(python3 -c 'import json; print(json.load(open("Dist/metadata.json", encoding="utf-8")).get("modVersion", ""))')"
          if [[ "${META_VER}" != "${TAG_VER}" ]]; then
            echo "::warning::Dist/metadata.json modVersion (${META_VER}) differs from tag (${TAG_VER}); syncing metadata.json to ${TAG_VER}."
            python3 - "${TAG_VER}" <<'PY'
          import json, sys
          with open("Dist/metadata.json", "r", encoding="utf-8") as fp:
              data = json.load(fp)
          data["modVersion"] = sys.argv[1]
          with open("Dist/metadata.json", "w", encoding="utf-8", newline="\n") as fp:
              json.dump(data, fp, indent="\t", ensure_ascii=False)
              fp.write("\n")
          PY
          fi

          OUT_DIR="$(mktemp -d)"
          ARCHIVE_NAME="SephiriaOptimizer_v${TAG_VER}.zip"
          ARCHIVE_PATH="${OUT_DIR}/${ARCHIVE_NAME}"

          STAGE_DIR="${OUT_DIR}/stage"
          mkdir -p "${STAGE_DIR}"
          cp -f Dist/SephiriaOptimizer.dll "${STAGE_DIR}/"
          cp -f Dist/metadata.json "${STAGE_DIR}/"
          for script_file in Install.bat Uninstall.bat install.ps1 install.sh; do
            if [[ -f "Dist/${script_file}" ]]; then
              cp -f "Dist/${script_file}" "${STAGE_DIR}/"
            fi
          done

          (cd "${STAGE_DIR}" && zip -9 -r "${ARCHIVE_PATH}" .)

          echo "tag_name=v${TAG_VER}" >> "${GITHUB_OUTPUT}"
          echo "archive_path=${ARCHIVE_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag_name }}
          name: "SephiriaOptimizer ${{ steps.package.outputs.tag_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            ${{ steps.package.outputs.archive_path }}
            Dist/SephiriaOptimizer.dll
            Dist/metadata.json
